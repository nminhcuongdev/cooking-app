<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bếp Nhà</title>
  <meta name="description" content="Hướng dẫn nấu món ăn gia đình Việt từng bước, có hoạt cảnh 3D minh họa.">
  <meta name="theme-color" content="#c2410c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* Bếp Nhà — giao diện */
:root {
  --bg: #fbf6ef;
  --surface: #ffffff;
  --surface-2: #f4ece1;
  --text: #2a211b;
  --muted: #6f6258;
  --line: #e7dccd;
  --accent: #c2410c;
  --accent-2: #ea7a2f;
  --accent-ink: #ffffff;
  --ok: #2f855a;
  --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 6px 20px rgba(60, 40, 20, .08);
  --radius: 16px;
  --topbar-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171412; --surface: #221e1a; --surface-2: #2c2620; --text: #f3ece4; --muted: #b3a597;
    --line: #3a322b; --accent: #fb8a4c; --accent-2: #f6a46c; --accent-ink: #1b120c; --ok: #6fcf97;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171412; --surface: #221e1a; --surface-2: #2c2620; --text: #f3ece4; --muted: #b3a597;
  --line: #3a322b; --accent: #fb8a4c; --accent-2: #f6a46c; --accent-ink: #1b120c; --ok: #6fcf97;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.55 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
img, svg { display: block; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 12px; top: 12px; z-index: 99; background: var(--surface); padding: 8px 12px; border-radius: 8px; }
:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; border-radius: 8px; }

/* ---------- Thanh trên ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--topbar-h);
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; color: var(--text); text-decoration: none; white-space: nowrap; }
.brand-mark { font-size: 24px; }
.search { flex: 1; max-width: 560px; margin-left: auto; position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); fill: var(--muted); }
.search input {
  width: 100%; height: 42px; padding: 0 14px 0 38px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 15px;
}
.search input::placeholder { color: var(--muted); }
.icon-btn {
  width: 42px; height: 42px; flex: none; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; cursor: pointer;
}
.icon-btn svg { width: 20px; height: 20px; fill: var(--text); }
body.cooking .topbar { display: none; }

/* ---------- Bố cục chung ---------- */
.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 64px; }
.hero {
  border-radius: 24px; padding: 28px 24px; margin-bottom: 20px;
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--accent-2) 35%, transparent), transparent 60%),
    linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--surface)), var(--surface));
  border: 1px solid var(--line);
  display: grid; gap: 8px;
}
.hero h1 { margin: 0; font-size: clamp(26px, 5vw, 40px); line-height: 1.15; letter-spacing: -.01em; }
.hero p { margin: 0; color: var(--muted); max-width: 60ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.stat b { color: var(--accent); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; margin-bottom: 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip .n { opacity: .7; margin-left: 4px; font-size: 12px; }

.result-info { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.card {
  position: relative; display: flex; flex-direction: column; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
  text-decoration: none; color: inherit; transition: transform .15s ease, box-shadow .15s ease;
}
.card:hover { transform: translateY(-2px); }
.thumb { height: 150px; display: grid; place-items: center; font-size: 56px; position: relative; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb.has-img .em { visibility: hidden; }
.thumb.has-img .acts { z-index: 1; }
.dphoto { width: 100%; aspect-ratio: 1 / 1; max-height: 420px; object-fit: cover; border-radius: var(--radius); box-shadow: var(--shadow); background: var(--surface-2); }
.done-box .dphoto { max-width: 280px; margin: 0 auto 12px; display: block; }
.thumb .em small, .dhead .emoji small { font-size: .55em; margin-left: -.15em; vertical-align: bottom; }
.thumb .acts { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 2px; font-size: 16px; background: rgba(255,255,255,.75); border-radius: 999px; padding: 2px 8px; }
.card-body { padding: 12px 14px 14px; display: grid; gap: 6px; flex: 1; }
.card h3 { margin: 0; font-size: 17px; line-height: 1.3; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 13px; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); align-self: start; }
.badge.mine { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.fav {
  position: absolute; top: 8px; right: 8px; width: 38px; height: 38px; border-radius: 999px; border: none;
  background: rgba(255,255,255,.85); display: grid; place-items: center; cursor: pointer; font-size: 18px;
}
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }

/* Màu nền theo nhóm món */
.g-ga { background: linear-gradient(135deg, #fde7c4, #f8c98a); }
.g-heo { background: linear-gradient(135deg, #fbd5cc, #f2a493); }
.g-bo { background: linear-gradient(135deg, #f2c4bb, #c9705f); }
.g-vit { background: linear-gradient(135deg, #f1d6c2, #d29a72); }
.g-ca { background: linear-gradient(135deg, #d6e8f3, #9cc6e0); }
.g-hai-san { background: linear-gradient(135deg, #ffdccc, #ffaf8a); }
.g-canh { background: linear-gradient(135deg, #e2f1d6, #b5dc98); }
.g-rau { background: linear-gradient(135deg, #d8f0d2, #8fcf82); }
.g-dau-trung { background: linear-gradient(135deg, #fff3c4, #ffd965); }

/* ---------- Trang chi tiết ---------- */
.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; text-decoration: none; font-weight: 600; min-height: 44px; }
.detail { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .detail { grid-template-columns: 380px 1fr; align-items: start; } .detail .side { position: sticky; top: calc(var(--topbar-h) + 16px); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.dhead { border-radius: var(--radius); padding: 22px 18px; display: grid; gap: 8px; color: #2a211b; }
.dhead .emoji { font-size: 48px; line-height: 1; }
.dhead h1 { margin: 0; font-size: clamp(24px, 4.5vw, 34px); line-height: 1.2; }
.dhead .tags { font-size: 14px; opacity: .85; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { background: rgba(255,255,255,.75); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 500; color: #2a211b; }
.intro { color: var(--muted); margin: 0; }
.cta {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; border: none; border-radius: 14px;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px; cursor: pointer; text-decoration: none;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent);
}
.cta:hover { filter: brightness(1.05); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--text);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
h2.sec { font-size: 19px; margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.scaler { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; }
.scaler button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 18px; }
.scaler output { min-width: 64px; text-align: center; }
.ing-group h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
.ing-group:first-of-type h3 { margin-top: 0; }
.ing { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.ing label { display: flex; gap: 10px; align-items: flex-start; padding: 7px 6px; border-radius: 10px; cursor: pointer; }
.ing label:hover { background: var(--surface-2); }
.ing input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.ing input:checked + span { text-decoration: line-through; color: var(--muted); }
.ing .q { font-weight: 700; }
.steps-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.steps-list li a {
  display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 12px; border-radius: 14px; border: 1px solid var(--line);
  text-decoration: none; color: inherit; background: var(--surface);
}
.steps-list li a:hover { border-color: var(--accent-2); }
.step-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: var(--surface-2); }
.steps-list b { display: block; }
.steps-list p { margin: 2px 0 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tips { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.note { font-size: 14px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin: 10px 0 0; }
.source { font-size: 14px; color: var(--muted); }
.stack { display: grid; gap: 16px; }

/* ---------- Chế độ nấu ---------- */
.cook { height: 100vh; height: 100dvh; display: grid; grid-template-rows: minmax(240px, 46%) 1fr; background: var(--bg); }
@media (min-width: 960px) { .cook { grid-template-rows: none; grid-template-columns: minmax(0, 1.45fr) minmax(380px, 1fr); } }
.stage { position: relative; min-height: 0; overflow: hidden; background: var(--surface-2); }
.stage canvas { display: block; touch-action: pan-y; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.stage-top { position: absolute; left: 12px; right: 12px; top: 12px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
.stage-top > * { pointer-events: auto; }
.glass {
  background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
}
.glass.btnish { cursor: pointer; min-height: 40px; text-decoration: none; color: var(--text); }
.stage-hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--surface) 80%, transparent); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; font-size: 96px; }
.fallback small { display: block; font-size: 14px; color: var(--muted); text-align: center; }

.cpanel { min-height: 0; display: grid; grid-template-rows: auto 1fr auto; background: var(--surface); border-top: 1px solid var(--line); }
@media (min-width: 960px) { .cpanel { border-top: none; border-left: 1px solid var(--line); } }
.chead { padding: 14px 16px 8px; display: grid; gap: 8px; }
.ctitle-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.crecipe { font-size: 14px; color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progress { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width .3s ease; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 30px; height: 30px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 700; cursor: pointer; display: grid; place-items: center; }
.dot.done { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: transparent; }
.dot.cur { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cbody { overflow-y: auto; padding: 4px 16px 16px; -webkit-overflow-scrolling: touch; }
.cbody .num { color: var(--accent); font-weight: 800; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
.cbody h2 { margin: 2px 0 10px; font-size: clamp(22px, 3.2vw, 28px); line-height: 1.2; }
.cbody p { margin: 0 0 10px; font-size: 17px; }
.cbody ul { margin: 0 0 10px; padding-left: 20px; display: grid; gap: 4px; font-size: 17px; }
.timer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 12px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }
.timer .t { font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 800; min-width: 84px; }
.timer.ring { animation: ring 1s ease infinite; }
@keyframes ring { 50% { background: color-mix(in srgb, var(--accent) 30%, var(--surface-2)); } }
.cfoot { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.cfoot .btn, .cfoot .cta { min-height: 52px; }
.done-box { text-align: center; padding: 24px 8px; }
.done-box .big { font-size: 64px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
  transition: .25s ease; pointer-events: none; z-index: 50; max-width: calc(100vw - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 560px) {
  .topbar { gap: 8px; padding: 0 12px; }
  .brand span:last-child { display: none; }
  .wrap { padding: 14px 16px 56px; }
  .hero { padding: 20px 16px; }
  .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .thumb { height: 118px; font-size: 44px; }
  .card h3 { font-size: 15px; }
  .card-body { padding: 10px 10px 12px; }
  .meta { font-size: 12px; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb.has-img .em { visibility: hidden; }
.thumb.has-img .acts { z-index: 1; }
.dphoto { width: 100%; aspect-ratio: 1 / 1; max-height: 420px; object-fit: cover; border-radius: var(--radius); box-shadow: var(--shadow); background: var(--surface-2); }
.done-box .dphoto { max-width: 280px; margin: 0 auto 12px; display: block; }
.thumb .em small, .dhead .emoji small { font-size: .55em; margin-left: -.15em; vertical-align: bottom; }
.thumb .acts { display: none; }
}
@media (max-width: 360px) { .grid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>
<body>
  <a class="skip" href="#main">Bỏ qua tới nội dung</a>
  <header class="topbar" id="topbar">
    <a class="brand" href="#" aria-label="Bếp Nhà – trang chủ"><span class="brand-mark" aria-hidden="true">🍳</span><span>Bếp Nhà</span></a>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.2 4.2-1.4 1.4-4.2-4.2A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
      <input id="q" type="search" placeholder="Tìm món, nguyên liệu… (gà, sả, canh)" autocomplete="off" aria-label="Tìm công thức">
    </div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
    </button>
  </header>
  <main id="main" tabindex="-1"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>window.BEPNHA_IMG_BASE = '../';</script>

      case 'quail': g = new THREE.SphereGeometry(0.11, 14, 10); break;
      case 'sphere': g = new THREE.SphereGeometry(0.17, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2); break;
      case 'small': g = new THREE.DodecahedronGeometry(0.07); break;
      case 'stick': g = new THREE.CylinderGeometry(0.035, 0.035, 0.42, 8); break;
      case 'disc': g = new THREE.CylinderGeometry(0.14, 0.14, 0.05, 18); break;
      case 'leaf': g = new THREE.SphereGeometry(0.2, 12, 6); break;
      case 'mushroom': {
        obj = new THREE.Group();
        const cap = mesh(new THREE.SphereGeometry(0.15, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), m);
        cap.position.y = 0.08; obj.add(cap);
        const stem = mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.14, 10), mat(0xeadfc8));
        obj.add(stem);
        break;
      }
      default: g = new THREE.BoxGeometry(0.3, 0.2, 0.3);
    }
    if (!obj) obj = mesh(g, m);
    if (k.shape === 'fish') obj.scale.set(1.8, 0.55, 0.8);
    if (k.shape === 'leaf') obj.scale.set(1.1, 0.12, 0.7);
    if (k.shape === 'egg') obj.scale.set(1, 1.25, 1);
    if (k.shape === 'shell') obj.scale.set(1, 0.6, 0.85);
    obj.userData.kind = kind;
    return obj;
  }

  function pieceSet(kinds, n) {
    const out = [];
    for (let i = 0; i < n; i++) out.push(makePiece(kinds[i % kinds.length]));
    return out;
  }

  /* Hạt hơi nước / khói bay lên */
  function Steam(group, opts) {
    const THREE = T();
    const o = Object.assign({ count: 26, radius: 0.9, y: 1.2, height: 2.4, color: 0xffffff, opacity: 0.35, size: 0.18, speed: 0.55 }, opts || {});
    const geo = new THREE.SphereGeometry(1, 10, 8);
    const parts = [];
    for (let i = 0; i < o.count; i++) {
      const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: o.color, transparent: true, opacity: 0, depthWrite: false }));
      m.userData = { life: Math.random(), x: rnd(-o.radius, o.radius), z: rnd(-o.radius, o.radius), drift: rnd(-0.3, 0.3) };
      group.add(m); parts.push(m);
    }
    return function update(dt) {
      for (const p of parts) {
        const d = p.userData;
        d.life += dt * o.speed / (o.height / 2.4);
        if (d.life > 1) { d.life = 0; d.x = rnd(-o.radius, o.radius); d.z = rnd(-o.radius, o.radius); }
        const s = o.size * (0.6 + d.life * 2.2);
        p.scale.setScalar(s);
        p.position.set(d.x + Math.sin(d.life * 6 + d.drift * 10) * 0.15 + d.drift * d.life, o.y + d.life * o.height, d.z);
        p.material.opacity = o.opacity * Math.sin(Math.PI * d.life);
      }
    };
  }

  /* Bọt khí trong nồi/chảo */
  function Bubbles(group, opts) {
    const THREE = T();
    const o = Object.assign({ count: 18, radius: 0.9, y: 0.6, rise: 0.25, color: 0xffffff, size: 0.05, speed: 1.4 }, opts || {});
    const parts = [];
    const geo = new THREE.SphereGeometry(1, 8, 6);
    for (let i = 0; i < o.count; i++) {
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: o.color, transparent: true, opacity: 0.7, roughness: 0.1 }));
      const r = Math.sqrt(Math.random()) * o.radius, a = rnd(0, Math.PI * 2);
      m.userData = { life: Math.random(), x: Math.cos(a) * r, z: Math.sin(a) * r };
      group.add(m); parts.push(m);
    }
    return function update(dt) {
      for (const p of parts) {
        const d = p.userData;
        d.life += dt * o.speed * rnd(0.6, 1.4);
        if (d.life > 1) {
          d.life = 0; const r = Math.sqrt(Math.random()) * o.radius, a = rnd(0, Math.PI * 2);
          d.x = Math.cos(a) * r; d.z = Math.sin(a) * r;
        }
        p.position.set(d.x, o.y + d.life * o.rise, d.z);
        p.scale.setScalar(o.size * (0.5 + d.life));
        p.material.opacity = 0.75 * (1 - d.life);
      }
    };
  }

  /* Bếp gas với ngọn lửa */
  function Stove(group, flameScale) {
    const THREE = T();
    const base = mesh(new THREE.BoxGeometry(3.2, 0.3, 3.2), mat(0x2f3236, { metalness: 0.4, roughness: 0.35 }));
    base.position.y = 0.15; group.add(base);
    const ring = mesh(new THREE.TorusGeometry(0.7, 0.06, 8, 32), mat(0x1a1a1a, { metalness: 0.7, roughness: 0.3 }));
    ring.rotation.x = Math.PI / 2; ring.position.y = 0.34; group.add(ring);
    const flames = [];
    const fs = flameScale == null ? 1 : flameScale;
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      const f = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.3, 8),
        new THREE.MeshBasicMaterial({ color: i % 2 ? 0x3d8bff : 0xff9a2e, transparent: true, opacity: 0.85 }));
      f.position.set(Math.cos(a) * 0.62, 0.45, Math.sin(a) * 0.62);
      f.userData.phase = rnd(0, 6);
      group.add(f); flames.push(f);
    }
    return function update(t) {
      for (const f of flames) {
        const s = fs * (0.75 + 0.35 * Math.sin(t * 18 + f.userData.phase));
        f.scale.set(1, s, 1);
        f.position.y = 0.36 + 0.15 * s;
      }
    };
  }

  function Pot(group, color, y) {
    const THREE = T();
    const pot = lathe([[0.01, 0], [1.05, 0], [1.1, 0.06], [1.12, 1.15], [1.18, 1.2]], color || 0xb8bec6, { metalness: 0.75, roughness: 0.28 });
    pot.position.y = y; group.add(pot);
    for (const s of [-1, 1]) {
      const h = mesh(new THREE.TorusGeometry(0.16, 0.04, 8, 16, Math.PI), mat(0x222222));
      h.position.set(s * 1.2, y + 1.0, 0); h.rotation.z = s > 0 ? -Math.PI / 2 : Math.PI / 2; group.add(h);
    }
    return pot;
  }

  function Liquid(group, radius, y, color, opacity) {
    const THREE = T();
    const m = new THREE.Mesh(new THREE.CircleGeometry(radius, 40),
      new THREE.MeshStandardMaterial({ color, transparent: true, opacity: opacity == null ? 0.85 : opacity, roughness: 0.15, metalness: 0.1 }));
    m.rotation.x = -Math.PI / 2; m.position.y = y; m.receiveShadow = true;
    group.add(m); return m;
  }

  function placeRing(pieces, radius, y, group, jitter) {
    pieces.forEach((p, i) => {
      const a = (i / pieces.length) * Math.PI * 2 + rnd(-0.2, 0.2);
      const r = radius * Math.sqrt(rnd(0.15, 1));
      p.position.set(Math.cos(a) * r, y + rnd(0, jitter || 0), Math.sin(a) * r);
      p.rotation.set(rnd(0, 3), rnd(0, 3), rnd(0, 3));
      p.userData.home = p.position.clone();
      p.userData.phase = rnd(0, Math.PI * 2);
      group.add(p);
    });
  }

  /* ---------- 4. Các cảnh theo thao tác ---------- */
  const BUILDERS = {
    prep(g, kinds) {
      const THREE = T();
      const board = mesh(new THREE.BoxGeometry(3.6, 0.16, 2.3), mat(0x9a6a40, { roughness: 0.8 }));
      board.position.y = 0.08; g.add(board);
      const knife = new THREE.Group();
      const blade = mesh(new THREE.BoxGeometry(1.5, 0.42, 0.03), mat(0xdfe4ea, { metalness: 0.9, roughness: 0.2 }));
      blade.position.x = -0.2; knife.add(blade);
      const handle = mesh(new THREE.BoxGeometry(0.7, 0.16, 0.1), mat(0x3b2a20));
      handle.position.set(0.85, 0.12, 0); knife.add(handle);
      knife.rotation.y = Math.PI / 2; g.add(knife);
      const pieces = pieceSet(kinds, 12);
      pieces.forEach((p, i) => {
        const col = i % 6, row = Math.floor(i / 6);
        p.position.set(-1.25 + col * 0.42, 0.28, -0.35 + row * 0.6);
        p.rotation.set(0, rnd(-0.4, 0.4), 0);
        p.userData.home = p.position.clone(); g.add(p);
      });
      return (t) => {
        const cut = Math.abs(Math.sin(t * 5));
        const xs = -1.25 + ((t * 0.55) % 1) * 2.5;
        knife.position.set(xs, 0.4 + cut * 0.7, 0.05);
        pieces.forEach(p => {
          const d = Math.abs(p.position.x - xs);
          const near = d < 0.25 && cut < 0.25;
          p.position.y = p.userData.home.y + (near ? 0.05 : 0);
          p.scale.x = near ? 0.85 : 1;
        });
      };
    },

    marinate(g, kinds) {
      const THREE = T();
      const bowl = lathe([[0.01, 0], [0.7, 0], [1.25, 0.45], [1.55, 1.05], [1.6, 1.12]], 0xf3efe7, { roughness: 0.35 });
      bowl.position.y = 0.02; g.add(bowl);
      const inner = Liquid(g, 1.25, 0.5, 0x8a4a1c, 0.55);
      const pieces = pieceSet(kinds, 12);
      placeRing(pieces, 1.0, 0.6, g, 0.15);
      const spoon = new THREE.Group();
      const stick = mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.8, 8), mat(0xc79b62));
      stick.position.y = 0.9; spoon.add(stick);
      const head = mesh(new THREE.SphereGeometry(0.2, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xc79b62, { side: THREE.DoubleSide }));
      head.rotation.x = Math.PI; spoon.add(head);
      spoon.rotation.z = 0.35; g.add(spoon);
      const sprinkle = [];
      const sg = new THREE.SphereGeometry(0.035, 6, 4);
      const colors = [0xffffff, 0x3a2a1a, 0xd9351f, 0xf2d06b];
      for (let i = 0; i < 40; i++) {
        const s = new THREE.Mesh(sg, mat(colors[i % colors.length]));
        s.userData = { life: Math.random(), x: rnd(-0.5, 0.5), z: rnd(-0.5, 0.5) };
        g.add(s); sprinkle.push(s);
      }
      return (t, dt) => {
        const a = t * 1.6;
        spoon.position.set(Math.cos(a) * 0.55, 0.45, Math.sin(a) * 0.55);
        spoon.rotation.y = -a;
        pieces.forEach((p, i) => {
          const h = p.userData.home; const r = Math.hypot(h.x, h.z); const b = Math.atan2(h.z, h.x) + t * 0.9;
          p.position.set(Math.cos(b) * r, h.y + Math.sin(t * 3 + i) * 0.05, Math.sin(b) * r);
          p.rotation.y += dt * 1.2;
        });
        for (const s of sprinkle) {
          const d = s.userData; d.life += dt * 0.7;
          if (d.life > 1) { d.life = 0; d.x = rnd(-0.5, 0.5); d.z = rnd(-0.5, 0.5); }
          s.position.set(d.x, 3.0 - d.life * 2.4, d.z);
          s.visible = d.life < 0.97;
        }
        inner.material.opacity = 0.45 + 0.1 * Math.sin(t * 2);
      };
    },

    stirfry(g, kinds) {
      const THREE = T();
      const stove = Stove(g, 1.2);
      const wok = new THREE.Group();
      const body = lathe([[0.01, 0], [0.6, 0.02], [1.2, 0.3], [1.55, 0.7], [1.6, 0.74]], 0x2b2b2e, { metalness: 0.65, roughness: 0.35 });
      wok.add(body);
      const handle = mesh(new THREE.CylinderGeometry(0.07, 0.08, 1.4, 10), mat(0x4a3324));
      handle.rotation.z = Math.PI / 2; handle.position.set(2.25, 0.62, 0); wok.add(handle);
      const oil = Liquid(wok, 0.75, 0.08, 0xf2c14e, 0.5);
      wok.position.y = 0.6; g.add(wok);
      const pieces = pieceSet(kinds, 14);
      placeRing(pieces, 0.85, 0.3, wok, 0.1);
      const smoke = Steam(g, { y: 1.5, radius: 0.7, count: 18, opacity: 0.22, color: 0xe8e2da });
      return (t, dt) => {
        stove(t);
        const toss = Math.max(0, Math.sin(t * 3.2));
        wok.rotation.z = -0.12 * toss; wok.position.x = 0.15 * toss;
        pieces.forEach((p, i) => {
          const h = p.userData.home; const ph = p.userData.phase;
          const jump = Math.max(0, Math.sin(t * 3.2 - 0.4 + ph * 0.15)) ** 2 * 1.1;
          p.position.set(h.x - 0.25 * jump, h.y + jump, h.z);
          p.rotation.x += dt * (2 + i % 3); p.rotation.z += dt * 1.5;
        });
        oil.material.opacity = 0.4 + 0.1 * Math.sin(t * 9);
        smoke(dt);
      };
    },

    fry(g, kinds) {
      const THREE = T();
      const stove = Stove(g, 1);
      const pan = lathe([[0.01, 0], [1.3, 0], [1.38, 0.08], [1.42, 0.62], [1.48, 0.66]], 0x2b2b2e, { metalness: 0.6, roughness: 0.35 });
      pan.position.y = 0.6; g.add(pan);
      const handle = mesh(new THREE.CylinderGeometry(0.07, 0.08, 1.5, 10), mat(0x1d1d1d));
      handle.rotation.z = Math.PI / 2; handle.position.set(2.2, 1.1, 0); g.add(handle);
      Liquid(g, 1.38, 0.95, 0xf0b93a, 0.75);
      const pieces = pieceSet(kinds, 10);
      placeRing(pieces, 0.95, 0.98, g, 0);
      const bubbles = Bubbles(g, { y: 0.93, rise: 0.12, radius: 1.2, count: 40, color: 0xfff1c2, size: 0.05, speed: 2.2 });
      const base = pieces.map(p => p.children.length ? null : p.material.color.clone());
      const gold = new THREE.Color(0xc77a1e);
      return (t, dt) => {
        stove(t); bubbles(dt);
        const k = (Math.sin(t * 0.5) + 1) / 2;
        pieces.forEach((p, i) => {
          const h = p.userData.home;
          p.position.y = h.y + Math.sin(t * 6 + p.userData.phase) * 0.03;
          p.rotation.y += dt * 0.3;
          if (base[i]) p.material.color.copy(base[i]).lerp(gold, k * 0.65);
        });
      };
    },

    boil(g, kinds, opt) {
      const THREE = T();
      const stove = Stove(g, 1);
      Pot(g, 0xb8bec6, 0.5);
      const water = Liquid(g, 1.08, 1.35, (opt && opt.liquid) || 0x9fd0e0, 0.7);
      const pieces = pieceSet(kinds, 10);
      placeRing(pieces, 0.75, 1.3, g, 0.05);
      const bubbles = Bubbles(g, { y: 1.2, rise: 0.2, radius: 0.95, count: 30, color: 0xffffff, size: 0.06, speed: 1.8 });
      const steam = Steam(g, { y: 1.8, radius: 0.6, count: 26 });
      return (t, dt) => {
        stove(t); bubbles(dt); steam(dt);
        water.position.y = 1.35 + Math.sin(t * 7) * 0.012;
        pieces.forEach((p, i) => {
          const h = p.userData.home; const b = Math.atan2(h.z, h.x) + t * 0.4; const r = Math.hypot(h.x, h.z);
          p.position.set(Math.cos(b) * r, h.y + Math.sin(t * 3 + i) * 0.06, Math.sin(b) * r);
          p.rotation.y += dt * 0.5;
        });
      };
    },

    season(g, kinds) {
      const THREE = T();
      const upd = BUILDERS.boil(g, kinds, { liquid: 0xd9a066 });
      const bottle = new THREE.Group();
      const body = mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.9, 16), mat(0x8a3b16, { roughness: 0.2, transparent: true, opacity: 0.9 }));
      bottle.add(body);
      const neck = mesh(new THREE.CylinderGeometry(0.08, 0.14, 0.35, 12), mat(0x8a3b16, { roughness: 0.2 }));
      neck.position.y = 0.62; bottle.add(neck);
      const cap = mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.1, 12), mat(0xd62f2f));
      cap.position.y = 0.84; bottle.add(cap);
      bottle.position.set(0.9, 3.0, 0); g.add(bottle);
      const drops = [];
      for (let i = 0; i < 10; i++) {
        const d = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), mat(0x8a3b16, { roughness: 0.1 }));
        d.userData.life = i / 10; g.add(d); drops.push(d);
      }
      return (t, dt) => {
        upd(t, dt);
        const tilt = 0.9 + 0.5 * Math.max(0, Math.sin(t * 1.2));
        bottle.rotation.z = tilt;
        const pouring = tilt > 1.2;
        for (const d of drops) {
          d.userData.life += dt * 1.5; if (d.userData.life > 1) d.userData.life = 0;
          d.visible = pouring;
          d.position.set(0.35 - d.userData.life * 0.15, 2.85 - d.userData.life * 1.5, 0);
        }
      };
    },

    braise(g, kinds) {
      const THREE = T();
      const stove = Stove(g, 0.7);
      const pot = lathe([[0.01, 0], [0.85, 0], [1.15, 0.25], [1.25, 0.8], [1.15, 1.05], [1.2, 1.1]], 0x8a4b2a, { roughness: 0.9 });
      pot.position.y = 0.5; g.add(pot);
      const sauce = Liquid(g, 1.18, 1.25, 0x7a3510, 0.92);
      const pieces = pieceSet(kinds, 10);
      placeRing(pieces, 0.8, 1.28, g, 0.04);
      const bubbles = Bubbles(g, { y: 1.22, rise: 0.12, radius: 0.95, count: 16, color: 0xc0703a, size: 0.07, speed: 0.9 });
      const steam = Steam(g, { y: 1.6, radius: 0.6, count: 16, opacity: 0.25 });
      const c1 = new THREE.Color(0xa0541f), c2 = new THREE.Color(0x5a2208);
      return (t, dt) => {
        stove(t); bubbles(dt); steam(dt);
        const k = (Math.sin(t * 0.35) + 1) / 2;
        sauce.material.color.copy(c1).lerp(c2, k);
        pieces.forEach((p, i) => { p.position.y = p.userData.home.y + Math.sin(t * 1.5 + i) * 0.03; });
      };
    },

    steam(g, kinds) {
      const THREE = T();
      const stove = Stove(g, 0.9);
      Pot(g, 0xb8bec6, 0.5);
      const baskets = [];
      for (let i = 0; i < 2; i++) {
        const b = mesh(new THREE.CylinderGeometry(1.15, 1.1, 0.5, 32, 1, true), mat(0xd9b46a, { side: THREE.DoubleSide, roughness: 0.9 }));
        b.position.y = 1.95 + i * 0.52; g.add(b); baskets.push(b);
        const rim = mesh(new THREE.TorusGeometry(1.15, 0.04, 6, 32), mat(0xb88d44));
        rim.rotation.x = Math.PI / 2; rim.position.y = 2.2 + i * 0.52; g.add(rim);
      }
      const lid = lathe([[0.01, 0.45], [0.6, 0.38], [1.0, 0.18], [1.18, 0]], 0xd9b46a, { roughness: 0.9 });
      lid.position.y = 2.7; g.add(lid);
      const pieces = pieceSet(kinds, 6);
      placeRing(pieces, 0.6, 1.8, g, 0);
      const steam = Steam(g, { y: 2.8, radius: 1.0, count: 40, opacity: 0.4, height: 2.2, speed: 0.7 });
      const leak = Steam(g, { y: 2.2, radius: 1.2, count: 14, opacity: 0.25, height: 1.2, size: 0.12 });
      return (t, dt) => {
        stove(t); steam(dt); leak(dt);
        lid.position.y = 2.7 + Math.max(0, Math.sin(t * 2.5)) * 0.04;
      };
    },

    grill(g, kinds) {
      const THREE = T();
      const box = mesh(new THREE.BoxGeometry(3.4, 0.9, 2.2), mat(0x2b2b2b, { metalness: 0.5, roughness: 0.4 }));
      box.position.y = 0.45; g.add(box);
      const coals = [];
      for (let i = 0; i < 18; i++) {
        const c = mesh(new THREE.DodecahedronGeometry(rnd(0.12, 0.2)), new THREE.MeshStandardMaterial({ color: 0x3a1206, emissive: 0xff4a12, emissiveIntensity: 0.6 }), false);
        c.position.set(rnd(-1.4, 1.4), 0.95, rnd(-0.8, 0.8)); c.userData.phase = rnd(0, 6); g.add(c); coals.push(c);
      }
      for (let i = 0; i < 11; i++) {
        const bar = mesh(new THREE.CylinderGeometry(0.025, 0.025, 2.2, 6), mat(0x9aa0a6, { metalness: 0.9, roughness: 0.3 }));
        bar.rotation.x = Math.PI / 2; bar.position.set(-1.5 + i * 0.3, 1.2, 0); g.add(bar);
      }
      const pieces = pieceSet(kinds, 8);
      pieces.forEach((p, i) => {
        p.position.set(-1.2 + (i % 4) * 0.8, 1.35, i < 4 ? -0.45 : 0.45);
        p.userData.home = p.position.clone(); p.userData.phase = i * 0.7; g.add(p);
      });
      const smoke = Steam(g, { y: 1.5, radius: 1.0, count: 22, color: 0xbdb6ad, opacity: 0.18, size: 0.14 });
      const grilled = new THREE.Color(0x9b4a1c);
      pieces.forEach(p => { if (p.material) p.material.color.lerp(grilled, 0.35); });
      return (t, dt) => {
        smoke(dt);
        coals.forEach(c => { c.material.emissiveIntensity = 0.45 + 0.35 * Math.sin(t * 4 + c.userData.phase); });
        pieces.forEach(p => {
          const cyc = ((t * 0.35 + p.userData.phase * 0.1) % 2);
          const flip = cyc < 0.25 ? cyc / 0.25 : 1;
          p.position.y = p.userData.home.y + Math.sin(Math.min(flip, 1) * Math.PI) * 0.5;
          p.rotation.x = Math.floor(t * 0.35 + p.userData.phase * 0.1) * Math.PI + flip * Math.PI;
        });
      };
    },

    caramel(g) {
      const THREE = T();
      const stove = Stove(g, 0.7);
      const pan = lathe([[0.01, 0], [1.0, 0], [1.06, 0.06], [1.1, 0.45], [1.15, 0.5]], 0xc9ced4, { metalness: 0.8, roughness: 0.25 });
      pan.position.y = 0.6; g.add(pan);
      const handle = mesh(new THREE.CylinderGeometry(0.06, 0.07, 1.3, 10), mat(0x1d1d1d));
      handle.rotation.z = Math.PI / 2; handle.position.set(1.8, 0.95, 0); g.add(handle);
      const syrup = Liquid(g, 0.95, 0.72, 0xffffff, 0.95);
      const bubbles = Bubbles(g, { y: 0.7, rise: 0.08, radius: 0.85, count: 30, color: 0xffe2a8, size: 0.06, speed: 1.6 });
      const sugar = new THREE.Color(0xfbf7ee), amber = new THREE.Color(0x9a4a0e);
      return (t, dt) => {
        stove(t); bubbles(dt);
        const k = Math.min(1, (t % 10) / 8);
        syrup.material.color.copy(sugar).lerp(amber, k);
      };
    },

    soak(g, kinds) {
      const THREE = T();
      const bowl = lathe([[0.01, 0], [0.9, 0], [1.4, 0.4], [1.65, 1.1], [1.7, 1.15]], 0xcfe7f3, { transparent: true, opacity: 0.45, roughness: 0.05 });
      bowl.position.y = 0.02; g.add(bowl);
      const water = Liquid(g, 1.58, 0.95, 0x7fc3e2, 0.55);
      const pieces = pieceSet(kinds, 10);
      placeRing(pieces, 1.0, 0.7, g, 0.25);
      const bubbles = Bubbles(g, { y: 0.3, rise: 0.65, radius: 1.1, count: 22, color: 0xffffff, size: 0.04, speed: 0.6 });
      return (t, dt) => {
        bubbles(dt);
        water.position.y = 0.95 + Math.sin(t * 2) * 0.015;
        pieces.forEach((p, i) => {
          p.position.y = p.userData.home.y + Math.sin(t * 1.3 + i) * 0.08;
          p.rotation.y += dt * 0.3;
        });
      };
    },

    wrap(g, kinds) {
      const THREE = T();
      const board = mesh(new THREE.BoxGeometry(3.6, 0.16, 2.3), mat(0x9a6a40, { roughness: 0.8 }));
      board.position.y = 0.08; g.add(board);
      const leafMat = mat(0x5fae4a, { side: THREE.DoubleSide });
      const left = mesh(new THREE.PlaneGeometry(0.6, 1.0), leafMat);
      const right = mesh(new THREE.PlaneGeometry(0.6, 1.0), leafMat);
      const hingeL = new THREE.Group(), hingeR = new THREE.Group();
      left.position.x = -0.3; right.position.x = 0.3;
      hingeL.add(left); hingeR.add(right);
      hingeL.position.set(-0.08, 0.18, 0); hingeR.position.set(0.08, 0.18, 0);
      hingeL.rotation.x = hingeR.rotation.x = 0;
      const wrapG = new THREE.Group(); wrapG.add(hingeL, hingeR);
      left.rotation.x = right.rotation.x = -Math.PI / 2;
      wrapG.position.x = -0.9; g.add(wrapG);
      const filling = makePiece(kinds[0]);
      filling.scale.multiplyScalar(1.2); filling.position.set(-0.9, 0.3, 0); g.add(filling);
      const balls = [];
      const kc = (KINDS[kinds[0]] || KINDS.pork).color;
      for (let i = 0; i < 6; i++) {
        const b = mesh(new THREE.SphereGeometry(0.2, 16, 12), mat(kc));
        b.position.set(0.5 + (i % 3) * 0.5, 0.36, i < 3 ? -0.4 : 0.4); g.add(b); balls.push(b);
      }
      return (t) => {
        const cyc = (t % 4) / 4;
        const fold = Math.min(1, Math.max(0, (cyc - 0.2) / 0.5));
        hingeL.rotation.z = -fold * Math.PI * 0.92;
        hingeR.rotation.z = fold * Math.PI * 0.92;
        balls.forEach((b, i) => {
          const s = Math.min(1, Math.max(0.05, (t * 0.8 - i * 0.35) % 4));
          b.scale.set(s, s * (0.9 + 0.1 * Math.sin(t * 6 + i)), s);

      };
    },

    serve(g, kinds) {
      const THREE = T();
      const plate = mesh(new THREE.CylinderGeometry(1.6, 1.3, 0.12, 48), mat(0xffffff, { roughness: 0.25 }));
      plate.position.y = 0.06; g.add(plate);
      const rim = mesh(new THREE.TorusGeometry(1.55, 0.05, 8, 48), mat(0x3c7bd4, { roughness: 0.3 }));
      rim.rotation.x = Math.PI / 2; rim.position.y = 0.13; g.add(rim);
      const pieces = pieceSet(kinds, 14);
      pieces.forEach((p, i) => {
        const a = i * 2.4, r = 0.15 + (i / 14) * 0.85;

        p.rotation.set(rnd(0, 3), rnd(0, 3), rnd(0, 3)); g.add(p);

      const herbs = [];
      for (let i = 0; i < 12; i++) {
        const h = makePiece('herb'); h.scale.multiplyScalar(0.45);
        h.userData = { life: i / 12, x: rnd(-0.8, 0.8), z: rnd(-0.8, 0.8) }; g.add(h); herbs.push(h);

      const sparkle = Steam(g, { y: 0.8, radius: 0.7, count: 14, opacity: 0.2 });
      return (t, dt) => {
        g.rotation.y = t * 0.25; sparkle(dt);
        herbs.forEach(h => {

  };

  // Góc máy theo từng cảnh: y = điểm nhìn, r = hệ số khoảng cách.
  const CAM = {
    steam: { y: 1.7, r: 1.18 }, season: { y: 1.45, r: 1.05 }, boil: { y: 1.1, r: 1 },
    serve: { y: 0.5, r: 0.82 }, prep: { y: 0.35, r: 0.82 }, wrap: { y: 0.35, r: 0.8 },
    marinate: { y: 0.8, r: 0.9 }, soak: { y: 0.7, r: 0.9 }, caramel: { y: 0.8, r: 0.85 },
    fry: { y: 0.9, r: 0.92 }, grill: { y: 1.0, r: 0.95 },
  };

  /* ---------- 5. Sân khấu: renderer + camera + điều khiển kéo xoay ---------- */
  function supportsWebGL() {
    try {
      const c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));

  function Stage(container) {
    const THREE = T();
    this.container = container;
    this.ok = !!THREE && supportsWebGL();
    if (!this.ok) return;

    r.outputEncoding = THREE.sRGBEncoding;

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    this.orbit = { theta: 0.6, phi: 1.0, radius: 9, target: new THREE.Vector3(0, 1.0, 0), user: false };
    const hemi = new THREE.HemisphereLight(0xfff6ea, 0x8d7b68, 0.55);
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(4, 9, 5); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 });
    const fill = new THREE.PointLight(0xffc48a, 0.35, 20); fill.position.set(-4, 3, -3);
    this.scene.add(hemi, sun, fill);
    this.counter = mesh(new THREE.BoxGeometry(14, 0.4, 9), mat(0xd7c3a6, { roughness: 0.9 }));
    this.counter.position.y = -0.2; this.scene.add(this.counter);
    this.root = new THREE.Group(); this.scene.add(this.root);
    this.clock = new THREE.Clock();
    this.update = null; this.running = false;
    this._theme();
    this._bindControls();
    this._resize = this._resize.bind(this);
    if (window.ResizeObserver) { this.ro = new ResizeObserver(this._resize); this.ro.observe(container); }
    window.addEventListener('resize', this._resize);
    this._mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (this._mq && this._mq.addEventListener) this._mq.addEventListener('change', () => this._theme());
    this._resize();
    this._loop = this._loop.bind(this);
  }

  Stage.prototype._theme = function () {
    const dark = document.documentElement.dataset.theme === 'dark' ||
      (document.documentElement.dataset.theme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const THREE = T();
    this.scene.background = new THREE.Color(dark ? 0x23201d : 0xf7efe4);
    this.scene.fog = new THREE.Fog(dark ? 0x23201d : 0xf7efe4, 14, 26);
    this.counter.material.color.set(dark ? 0x5b4a3a : 0xc9ad8a);
  };

  Stage.prototype._bindControls = function () {
    const el = this.renderer.domElement, o = this.orbit;
    let drag = null;
    el.style.touchAction = 'pan-y';
    el.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, th: o.theta, ph: o.phi }; o.user = true; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', e => {
      if (!drag) return;
      o.theta = drag.th - (e.clientX - drag.x) * 0.008;
      o.phi = Math.min(1.45, Math.max(0.35, drag.ph - (e.clientY - drag.y) * 0.006));
    });
    const end = () => { drag = null; };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('wheel', e => {
      e.preventDefault(); o.radius = Math.min(14, Math.max(5, o.radius + e.deltaY * 0.005));

  };

  Stage.prototype.resetView = function () {
    Object.assign(this.orbit, { theta: 0.6, phi: 1.0, radius: (this._baseRadius || 9) * (this._camK || 1), user: false });
  };

  Stage.prototype._resize = function () {
    const w = this.container.clientWidth || 300, h = this.container.clientHeight || 200;
    this.renderer.setSize(w, h, false);
    this.renderer.domElement.style.width = w + 'px';
    this.renderer.domElement.style.height = h + 'px';
    this.camera.aspect = w / h;
    // Màn hình dọc (điện thoại) thì lùi camera xa hơn để thấy trọn vật thể.
    this._baseRadius = w / h < 1 ? 11.5 : 8.2;
    if (!this.orbit.user) this.orbit.radius = this._baseRadius * (this._camK || 1);

  };

  Stage.prototype._clear = function () {
    const root = this.root;

      if (o.geometry) o.geometry.dispose();
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());

  Stage.prototype.show = function (action, kinds) {
    if (!this.ok) return;
    this._clear();
    const g = new (T().Group)();
    this.root.add(g);
    const build = BUILDERS[action] || BUILDERS.prep;
    this.update = build(g, kinds && kinds.length ? kinds : ['pork']);
    const cam = CAM[action] || { y: 1.0, r: 1 };
    this.orbit.target.y = cam.y; this._camK = cam.r;

  };

  Stage.prototype.start = function () {
    if (!this.ok || this.running) return;

  Stage.prototype.stop = function () { this.running = false; };

  Stage.prototype._loop = function () {
    if (!this.running) return;
    const dt = Math.min(0.05, this.clock.getDelta());
    const t = this.clock.getElapsedTime() - (this.t0 || 0);
    const o = this.orbit;
    if (!o.user) o.theta = 0.6 + Math.sin(t * 0.25) * 0.35;

    c.position.set(
      o.target.x + o.radius * Math.sin(o.phi) * Math.sin(o.theta),
      o.target.y + o.radius * Math.cos(o.phi),
      o.target.z + o.radius * Math.sin(o.phi) * Math.cos(o.theta));

      this._pop = Math.min(1, this._pop + dt * 3.5);
      const e = 1 - Math.pow(1 - this._pop, 3);
      this._group.scale.setScalar(Math.max(0.01, e));
    }
    if (this.update) { try { this.update(t, dt); } catch (e) { console.error(e); this.update = null; } }
    this.renderer.render(this.scene, c);

  };

  Stage.prototype.dispose = function () {
    if (!this.ok) return;
    this.stop(); this._clear();
    if (this.ro) this.ro.disconnect();
    window.removeEventListener('resize', this._resize);
    this.renderer.dispose();

  };

  window.Cook3D = { Stage, classifyStep, stepKinds, detectKinds, ACTIONS, KINDS };
})();

  <script>
/* Bếp Nhà — điều hướng, danh sách, chi tiết và chế độ nấu từng bước. */
(function () {
  'use strict';

  const RECIPES = window.RECIPES || [];
  const C3 = window.Cook3D;
  const main = document.getElementById('main');
  const $q = document.getElementById('q');

  const GROUP_EMOJI = { ga: '🍗', heo: '🥓', bo: '🥩', vit: '🦆', ca: '🐟', 'hai-san': '🦐', canh: '🍲', rau: '🥬', 'dau-trung': '🥚' };
  const KIND_EMOJI = { shrimp: '🦐', clam: '🦪', squid: '🦑', fish: '🐟', chicken: '🍗', rib: '🍖', pork: '🥓', beef: '🥩',
    duck: '🦆', egg: '🍳', quail: '🥚', tofu: '🧈', leaf: '🥬', gourd: '🥒', mushroom: '🍄', potato: '🥔', pumpkin: '🎃',
    tomato: '🍅', bean: '🫛', corn: '🌽', pineapple: '🍍', carrot: '🥕' };
  function dishEmoji(r) {
    const k = C3 ? C3.detectKinds(r.title, 3) : [];
    const first = k.map(x => KIND_EMOJI[x]).find(Boolean) || GROUP_EMOJI[r.group] || '🍽️';
    const second = r.group === 'canh' ? '🍲' : (k.slice(1).map(x => KIND_EMOJI[x]).find(e => e && e !== first) || '');
    return first + (second ? `<small>${second}</small>` : '');
  }
  const GROUP_ORDER = ['ga', 'heo', 'bo', 'vit', 'ca', 'hai-san', 'canh', 'rau', 'dau-trung'];

  /* ---------- Lưu trữ cục bộ (an toàn khi bị chặn) ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem('bepnha:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('bepnha:' + k, JSON.stringify(v)); } catch (e) { /* bỏ qua */ } },
  };
  let favs = new Set(store.get('favs', []));
  const state = { filter: store.get('filter', 'all'), query: '' };

  /* ---------- Tiện ích ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
  const byId = id => RECIPES.find(r => r.id === id);
  // Bản gộp dist/bep-nha.html nằm trong thư mục con nên cần tiền tố '../' cho ảnh.
  const IMG_BASE = window.BEPNHA_IMG_BASE || '';
  RECIPES.forEach(r => { if (r.image) r.image = IMG_BASE + r.image; });

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // Phân loại trước các bước để dùng lại (icon + cảnh 3D).
  RECIPES.forEach(r => {
    r.steps.forEach(s => { s.action = C3 ? C3.classifyStep(s) : 'prep'; });
    r._raw = [r.title, r.groupName, r.tags, r.ingredients.map(g => g.items.join(' ')).join(' ')].join(' ').toLowerCase().replace(/muỗng (canh|cà phê)/g, ' ');
    r._search = norm(r._raw);
  });

  /* ---------- Định lượng theo khẩu phần ---------- */
  const FR = { '½': 0.5, '⅓': 1 / 3, '⅔': 2 / 3, '¼': 0.25, '¾': 0.75 };
  const QTY_RE = /^(\d+(?:[.,]\d+)?)?([½⅓⅔¼¾])?(?:\s*[–-]\s*(\d+(?:[.,]\d+)?)?([½⅓⅔¼¾])?)?/;
  function parseNum(a, f) {
    if (!a && !f) return null;
    return (a ? parseFloat(a.replace(',', '.')) : 0) + (f ? FR[f] : 0);
  }
  function fmt(n) {
    if (n >= 10) return String(Math.round(n));
    const whole = Math.floor(n), rest = n - whole;
    const opts = [[0, ''], [0.25, '¼'], [1 / 3, '⅓'], [0.5, '½'], [2 / 3, '⅔'], [0.75, '¾'], [1, '']];
    let best = opts[0];
    for (const o of opts) if (Math.abs(o[0] - rest) < Math.abs(best[0] - rest)) best = o;
    const w = whole + (best[0] === 1 ? 1 : 0);
    if (!best[1]) return String(w || (n > 0 ? '¼' : '0'));
    return (w ? w : '') + best[1];
  }
  function scaleLine(line, factor) {
    const m = line.match(QTY_RE);
    if (!m || !m[0].trim() || factor === 1) return { q: '', rest: line, scaled: false, raw: m && m[0].trim() ? m[0] : '' };
    const a = parseNum(m[1], m[2]); const b = parseNum(m[3], m[4]);
    if (a == null) return { q: '', rest: line, scaled: false };
    const q = fmt(a * factor) + (b != null ? '–' + fmt(b * factor) : '');
    return { q, rest: line.slice(m[0].length), scaled: true };
  }
  function baseServings(r) { const m = String(r.servings).match(/\d+/); return m ? parseInt(m[0], 10) : 0; }

  /* ---------- Trang chủ ---------- */
  function counts() {
    const c = { all: RECIPES.length, fav: RECIPES.filter(r => favs.has(r.id)).length };
    RECIPES.forEach(r => { c[r.group] = (c[r.group] || 0) + 1; });
    return c;
  }

  function filtered() {
    const raw = String(state.query || '').toLowerCase().trim();
    const accented = raw !== norm(raw);
    const q = accented ? raw : norm(raw);
    return RECIPES.filter(r => {
      if (state.filter === 'fav' && !favs.has(r.id)) return false;
      if (state.filter !== 'all' && state.filter !== 'fav' && r.group !== state.filter) return false;
      const hay = accented ? r._raw : r._search;
      if (q && !q.split(/\s+/).every(w => hay.includes(w))) return false;
      return true;
    });
  }

  function sourceLabel(r) {
    if (r.mine) return 'Công thức nhà mình';
    const u = (r.source && r.source.url) || '';
    if (/youtube\.com|youtu\.be/.test(u)) return 'Video YouTube';
    if (/monngonmoingay\.com/.test(u)) return 'Món Ngon Mỗi Ngày';
    try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return 'Nguồn ngoài'; }
  }

  function cardHTML(r) {
    const acts = [...new Set(r.steps.map(s => s.action))].slice(0, 4).map(a => C3 ? C3.ACTIONS[a].icon : '').join('');
    const fav = favs.has(r.id);
    return `<a class="card" href="#mon-${r.id}">
      <div class="thumb g-${r.group}${r.image ? ' has-img' : ''}" aria-hidden="true"><span class="em">${dishEmoji(r)}</span>${r.image ? `<img src="${esc(r.image)}" alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.remove('has-img');this.remove()">` : ''}<span class="acts">${acts}</span></div>
      <div class="card-body">
        <h3>${esc(r.title)}</h3>
        <div class="meta"><span>👥 ${esc(r.servings || '—')}</span><span>🧾 ${r.steps.length} bước</span></div>
        <span class="badge ${r.mine ? 'mine' : ''}">${esc(sourceLabel(r))}</span>
      </div>
      <button class="fav" type="button" data-fav="${r.id}" aria-pressed="${fav}" aria-label="${fav ? 'Bỏ yêu thích' : 'Thêm vào yêu thích'} ${esc(r.title)}">${fav ? '❤️' : '🤍'}</button>
    </a>`;
  }

  function renderHome() {
    document.body.classList.remove('cooking');
    document.title = 'Bếp Nhà';
    const c = counts();
    const totalSteps = RECIPES.reduce((n, r) => n + r.steps.length, 0);
    const chips = [['all', 'Tất cả'], ['fav', '❤️ Yêu thích']].concat(
      GROUP_ORDER.filter(g => c[g]).map(g => [g, GROUP_EMOJI[g] + ' ' + RECIPES.find(r => r.group === g).groupName]));
    main.innerHTML = `<div class="wrap">
      <section class="hero">
        <h1>Hôm nay nấu gì?</h1>
        <div class="stats"><span class="stat"><b>${RECIPES.length}</b> món</span><span class="stat"><b>${totalSteps}</b> bước có 3D</span><span class="stat"><b>${GROUP_ORDER.filter(g => c[g]).length}</b> nhóm món</span></div>
      </section>
      <div class="chips" role="toolbar" aria-label="Lọc theo nhóm món">
        ${chips.map(([k, l]) => `<button class="chip" type="button" data-filter="${k}" aria-pressed="${state.filter === k}">${esc(l)}<span class="n">${c[k] || 0}</span></button>`).join('')}
      </div>
      <p class="result-info" id="resInfo"></p>
      <div class="grid" id="grid"></div>
    </div>`;
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    if (!grid) return;
    const list = filtered();
    document.getElementById('resInfo').textContent = state.query
      ? `${list.length} món khớp "${state.query}"` : `${list.length} món`;
    grid.innerHTML = list.length ? list.map(cardHTML).join('')
      : `<div class="empty">${state.filter === 'fav' ? 'Chưa có món yêu thích. Bấm 🤍 trên thẻ món để lưu lại.' : 'Không tìm thấy món phù hợp. Thử từ khóa khác nhé.'}</div>`;
  }

  /* ---------- Trang chi tiết ---------- */
  function renderDetail(r) {
    document.body.classList.remove('cooking');
    document.title = r.title + ' · Bếp Nhà';
    const base = baseServings(r);
    const want = store.get('serv:' + r.id, base) || base;
    const factor = base ? want / base : 1;
    const checked = new Set(store.get('chk:' + r.id, []));
    const pills = [r.servings && '👥 ' + r.servings, r.time && r.time !== '—' && '⏱️ ' + r.time, r.difficulty && '📶 ' + r.difficulty].filter(Boolean);
    let idx = 0;
    const ingHTML = r.ingredients.map(g => `<div class="ing-group"><h3>${esc(g.name)}</h3><ul class="ing">${
      g.items.map(it => {
        const k = idx++; const s = scaleLine(it, factor);
        const text = s.scaled ? `<span class="q">${esc(s.q)}</span>${md(s.rest)}` : md(it);
        return `<li><label><input type="checkbox" data-chk="${k}" ${checked.has(k) ? 'checked' : ''}><span>${text}</span></label></li>`;
      }).join('')}</ul></div>`).join('');
    const fav = favs.has(r.id);
    main.innerHTML = `<div class="wrap">
      <a class="back" href="#">← Tất cả món</a>
      <div class="detail">
        <div class="side stack">
          ${r.image ? `<img class="dphoto" src="${esc(r.image)}" alt="Ảnh minh họa món ${esc(r.title)}" decoding="async" onerror="this.remove()">` : ''}
          <div class="dhead g-${r.group}">
            <div class="emoji" aria-hidden="true">${dishEmoji(r)}</div>
            <h1>${esc(r.title)}</h1>
            <div class="tags">${esc(r.tags)}</div>
            <div class="pills">${pills.map(p => `<span class="pill">${esc(p)}</span>`).join('')}</div>
          </div>
          ${r.intro ? `<p class="intro">${md(r.intro)}</p>` : ''}
          <a class="cta" href="#nau-1-${r.id}">▶ Bắt đầu nấu cùng 3D</a>
          <button class="btn" type="button" data-fav="${r.id}" aria-pressed="${fav}">${fav ? '❤️ Đã lưu yêu thích' : '🤍 Lưu vào yêu thích'}</button>
          <section class="panel">
            <h2 class="sec">Nguyên liệu
              ${base ? `<span class="scaler" aria-label="Điều chỉnh khẩu phần">
                <button type="button" data-serv="-1" aria-label="Giảm khẩu phần">−</button>
                <output aria-live="polite">${want} người</output>
                <button type="button" data-serv="1" aria-label="Tăng khẩu phần">+</button></span>` : ''}
            </h2>
            ${factor !== 1 ? `<p class="note">Định lượng đã quy đổi cho ${want} người (gốc ${base} người). Các mục "vừa đủ" giữ nguyên.</p>` : ''}
            ${ingHTML}
          </section>
        </div>
        <div class="stack">
          <section class="panel">
            <h2 class="sec">Các bước <span class="badge">${r.steps.length} bước</span></h2>
            <ol class="steps-list">${r.steps.map((s, i) => `<li><a href="#nau-${i + 1}-${r.id}">
              <span class="step-ico" aria-hidden="true">${C3 ? C3.ACTIONS[s.action].icon : '•'}</span>
              <span><b>${i + 1}. ${esc(s.title || 'Bước ' + (i + 1))}</b><p>${md(s.text || (s.subs || []).join(', '))}</p></span></a></li>`).join('')}</ol>
          </section>
          ${r.tips.length ? `<section class="panel"><h2 class="sec">Mẹo</h2><ul class="tips">${r.tips.map(t => `<li>${md(t)}</li>`).join('')}</ul></section>` : ''}
          ${r.notes.filter(n => !/^Quy ước/.test(n)).map(n => `<p class="note">ℹ️ ${md(n)}</p>`).join('')}
          <p class="source">${r.source ? `Nguồn: <a href="${esc(r.source.url)}" target="_blank" rel="noopener">${esc(r.source.name)}</a>. Định lượng giữ theo bản gốc.` : 'Công thức nhà mình, từ ghi chú cá nhân.'}</p>
        </div>
      </div>
    </div>`;
    main.querySelectorAll('[data-chk]').forEach(cb => cb.addEventListener('change', () => {
      const k = +cb.dataset.chk; cb.checked ? checked.add(k) : checked.delete(k);
      store.set('chk:' + r.id, [...checked]);
    }));
    main.querySelectorAll('[data-serv]').forEach(b => b.addEventListener('click', () => {
      const n = Math.max(1, Math.min(20, want + +b.dataset.serv));
      store.set('serv:' + r.id, n); renderDetail(r);
    }));
  }

  /* ---------- Chế độ nấu ---------- */
  let stage = null, wakeLock = null, timer = null;

  function stopTimer() { if (timer) { clearInterval(timer.id); timer = null; } }
  function beep() {
    try {
      const A = window.AudioContext || window.webkitAudioContext; const ctx = new A();
      [0, 0.35, 0.7].forEach(off => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, ctx.currentTime + off);
        g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + off + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + off + 0.3);
        o.start(ctx.currentTime + off); o.stop(ctx.currentTime + off + 0.32);
      });
    } catch (e) { /* bỏ qua */ }
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { /* bỏ qua */ }
  }
  const mmss = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
      if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) { wakeLock = null; }
  }

  function leaveCook() {
    stopTimer(); keepAwake(false);
    if (stage) { stage.dispose(); stage = null; }
  }

  function renderCook(r, n) {
    const total = r.steps.length;
    const finished = n > total;
    n = Math.max(1, Math.min(n, total + 1));
    document.body.classList.add('cooking');
    document.title = (finished ? 'Hoàn thành' : `Bước ${n}/${total}`) + ' · ' + r.title;
    stopTimer();

    let shell = main.querySelector('.cook');
    if (!shell || shell.dataset.id !== r.id) {
      leaveCook();
      main.innerHTML = `<div class="cook" data-id="${r.id}">
        <div class="stage" id="stage">
          <div class="stage-top">
            <a class="glass btnish" href="#mon-${r.id}" aria-label="Thoát chế độ nấu">✕ Thoát</a>
            <span class="glass" id="actLabel"></span>
          </div>
          <span class="stage-hint">Kéo để xoay · nhấp đúp để đặt lại góc nhìn</span>
        </div>
        <section class="cpanel" aria-live="polite">
          <div class="chead">
            <div class="ctitle-row"><span class="crecipe">${esc(r.title)}</span><a class="glass btnish" href="#mon-${r.id}" style="font-size:13px">🧾 Nguyên liệu</a></div>
            <div class="progress" aria-hidden="true"><i id="prog"></i></div>
            <div class="dots" id="dots" role="tablist" aria-label="Chọn bước"></div>
          </div>
          <div class="cbody" id="cbody"></div>
          <div class="cfoot"><button class="btn" id="prevBtn" type="button">← Trước</button><button class="cta" id="nextBtn" type="button">Tiếp →</button></div>
        </section>
      </div>`;
      shell = main.querySelector('.cook');
      const st = document.getElementById('stage');
      if (C3 && window.THREE) {
        stage = new C3.Stage(st);
        if (!stage.ok) { stage = null; }
      }
      if (!stage) st.insertAdjacentHTML('beforeend', `<div class="fallback"><div><span id="fbIcon">🍳</span><small>Thiết bị không hỗ trợ 3D (WebGL)</small></div></div>`);
      document.getElementById('prevBtn').addEventListener('click', () => go(r, cur() - 1));
      document.getElementById('nextBtn').addEventListener('click', () => go(r, cur() + 1));
      bindSwipe(document.getElementById('cbody'), r);
      keepAwake(true);
    }
    shell.dataset.step = n;

    const step = r.steps[Math.min(n, total) - 1];
    const action = finished ? 'serve' : step.action;
    const A = C3 ? C3.ACTIONS[action] : { icon: '🍳', label: '' };
    document.getElementById('actLabel').textContent = `${A.icon} ${finished ? 'Hoàn thành' : A.label}`;
    const kinds = C3 ? (finished ? C3.detectKinds(r.title, 3) : C3.stepKinds(step, r)) : [];
    if (stage) stage.show(action, kinds.length ? kinds : ['pork']);
    const fb = document.getElementById('fbIcon'); if (fb) fb.textContent = A.icon;

    document.getElementById('prog').style.width = (Math.min(n, total) / total * 100) + '%';
    document.getElementById('dots').innerHTML = r.steps.map((s, i) =>
      `<button type="button" role="tab" class="dot ${i + 1 === n ? 'cur' : i + 1 < n ? 'done' : ''}" aria-selected="${i + 1 === n}" aria-label="Bước ${i + 1}: ${esc(s.title)}" data-go="${i + 1}">${i + 1 < n ? '✓' : i + 1}</button>`).join('');
    document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(r, +b.dataset.go)));

    const body = document.getElementById('cbody');
    if (finished) {
      body.innerHTML = `<div class="done-box">${r.image ? `<img class="dphoto" src="${esc(r.image)}" alt="Ảnh minh họa món ${esc(r.title)}" onerror="this.remove()">` : '<div class="big">🎉</div>'}<h2>Xong rồi, mời cả nhà ăn cơm!</h2>
        <p>Bạn đã hoàn thành <b>${esc(r.title)}</b>.</p>
        ${r.tips.length ? `<p class="note" style="text-align:left">💡 ${md(r.tips[0])}</p>` : ''}</div>`;
    } else {
      body.innerHTML = `<div class="num">Bước ${n} / ${total}</div>
        <h2>${esc(step.title || 'Bước ' + n)}</h2>
        ${step.minutes ? `<div class="timer" id="timer"><span aria-hidden="true">⏲️</span><span class="t" id="tval">${mmss(step.minutes * 60)}</span>
          <button class="btn primary" id="tbtn" type="button">Bắt đầu hẹn giờ ${step.minutes} phút</button>
          <button class="btn" id="treset" type="button" hidden>Đặt lại</button></div>` : ''}
        ${step.text ? `<p>${md(step.text)}</p>` : ''}
        ${step.subs && step.subs.length ? `<ul>${step.subs.map(s => `<li>${md(s)}</li>`).join('')}</ul>` : ''}
        ${step.after ? `<p>${md(step.after)}</p>` : ''}`;
      if (step.minutes) bindTimer(step.minutes * 60);
    }
    body.scrollTop = 0;
    const prev = document.getElementById('prevBtn'), next = document.getElementById('nextBtn');
    prev.disabled = n <= 1;
    if (finished) { next.textContent = '↺ Về trang món'; }
    else next.textContent = n === total ? 'Hoàn thành ✓' : 'Tiếp →';
  }

  function cur() { const s = main.querySelector('.cook'); return s ? +s.dataset.step : 1; }
  function go(r, n) {
    if (n > r.steps.length + 1) { location.hash = '#mon-' + r.id; return; }
    if (n < 1) return;
    location.hash = `#nau-${n}-${r.id}`;
  }

  function bindTimer(total) {
    let left = total;
    const box = document.getElementById('timer'), val = document.getElementById('tval');
    const btn = document.getElementById('tbtn'), reset = document.getElementById('treset');
    const paint = () => { val.textContent = mmss(left); };
    btn.addEventListener('click', () => {
      if (timer) { stopTimer(); btn.textContent = 'Tiếp tục'; return; }
      if (left <= 0) left = total;
      box.classList.remove('ring'); reset.hidden = false; btn.textContent = 'Tạm dừng';
      timer = { id: setInterval(() => {
        left -= 1; paint();
        if (left <= 0) { stopTimer(); box.classList.add('ring'); btn.textContent = 'Chạy lại'; beep(); toast('⏰ Hết giờ! Chuyển sang bước tiếp theo nhé.'); }
      }, 1000) };
    });
    reset.addEventListener('click', () => { stopTimer(); left = total; paint(); box.classList.remove('ring'); btn.textContent = 'Bắt đầu hẹn giờ'; reset.hidden = true; });
  }

  function bindSwipe(el, r) {
    let sx = 0, sy = 0, t0 = 0;
    el.addEventListener('touchstart', e => { const p = e.touches[0]; sx = p.clientX; sy = p.clientY; t0 = Date.now(); }, { passive: true });
    el.addEventListener('touchend', e => {
      const p = e.changedTouches[0]; const dx = p.clientX - sx, dy = p.clientY - sy;
      if (Date.now() - t0 < 600 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(r, cur() + (dx < 0 ? 1 : -1));
    }, { passive: true });
  }

  /* ---------- Điều hướng ---------- */
  function route() {
    // #mon-<id> = trang món, #nau-<bước>-<id> = chế độ nấu
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    let m = h.match(/^nau-(\d+)-(.+)$/);
    if (m && byId(m[2])) { renderCook(byId(m[2]), parseInt(m[1], 10) || 1); return; }
    m = h.match(/^mon-(.+)$/);
    if (m && byId(m[1])) { leaveCook(); renderDetail(byId(m[1])); window.scrollTo(0, 0); return; }
    leaveCook(); renderHome();
  }

  /* ---------- Sự kiện chung ---------- */
  document.addEventListener('click', e => {
    const f = e.target.closest('[data-fav]');
    if (f) {
      e.preventDefault(); e.stopPropagation();
      const id = f.dataset.fav;
      favs.has(id) ? favs.delete(id) : favs.add(id);
      store.set('favs', [...favs]);
      toast(favs.has(id) ? 'Đã thêm vào yêu thích' : 'Đã bỏ khỏi yêu thích');
      const r = byId(id);
      if (location.hash.startsWith('#mon-')) renderDetail(r); else renderHome();
      return;
    }
    const c = e.target.closest('[data-filter]');
    if (c) {
      state.filter = c.dataset.filter; store.set('filter', state.filter);
      document.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', b === c));
      renderGrid();
    }
  });

  $q.addEventListener('input', () => {
    state.query = $q.value;
    if (!document.getElementById('grid')) { location.hash = '#'; return; }
    renderGrid();
  });

  document.addEventListener('keydown', e => {
    const s = main.querySelector('.cook');
    if (!s || /input|textarea/i.test(e.target.tagName)) return;
    const r = byId(s.dataset.id);
    if (e.key === 'ArrowRight') go(r, cur() + 1);
    if (e.key === 'ArrowLeft') go(r, cur() - 1);
    if (e.key === 'Escape') location.hash = '#mon-' + r.id;
  });

  document.addEventListener('visibilitychange', () => {
    if (!stage) return;
    if (document.hidden) stage.stop(); else { stage.start(); keepAwake(true); }
  });

  // Giao diện sáng/tối
  const theme = store.get('theme', null);
  if (theme) document.documentElement.dataset.theme = theme;
  document.getElementById('themeBtn').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    store.set('theme', document.documentElement.dataset.theme);
    if (stage) stage._theme();
  });

  // Liên kết "bỏ qua" chỉ chuyển tiêu điểm, không đổi hash (hash dùng cho điều hướng).
  document.querySelector('.skip').addEventListener('click', e => { e.preventDefault(); main.focus(); });

  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
